  <div id="root"></div>

    <!-- DL IPTV Overrides -->
  <script>
  (function() {
    const BRAND = 'DL IPTV';
    const TELEGRAM = 'https://t.me/DL_IPTV';
    const WHATSAPP = 'https://wa.me/DL_IPTV';
    const CORRECT_TITLE = 'DL IPTV Ethiopia — Premium IPTV | 2,330+ Channels, 49K+ VOD, 4K Sports';

    // Force correct document.title
    new MutationObserver(function() {
      if (!document.title.startsWith('DL IPTV')) {
        document.title = CORRECT_TITLE;
      }
    }).observe(document.querySelector('title') || document.head, { childList: true, subtree: true, characterData: true });

    setInterval(function() {
      if (!document.title.startsWith('DL IPTV')) document.title = CORRECT_TITLE;
    }, 1000);

    function rebrand(node) {
      if (node.nodeType === 3) {
        var t = node.nodeValue;
        t = t.replace(/DLIPTV/gi, BRAND);
        t = t.replace(/DLIPTV\.com/gi, 'dliptv.github.io/DLIPTV');
        t = t.replace(/\+1 647 366 5409/g, '@DL_IPTV on Telegram');
        t = t.replace(/\+1 753 339 0292/g, '@DL_IPTV');
        t = t.replace(/DLIPTV Media/gi, BRAND);
        t = t.replace(/\+1\s*753\s*339\s*0292/g, '@DL_IPTV');
        t = t.replace(/\+17533390292/g, '@DL_IPTV');
        t = t.replace(/35,000\+/g, '2,330+');
        t = t.replace(/150,000\+/g, '49,000+');
        t = t.replace(/Contact@DL IPTV\.com/gi, 'DL_IPTV');
        node.nodeValue = t;
      }
      if (node.nodeType === 1 && node.nodeName !== 'SCRIPT' && node.nodeName !== 'STYLE') {
        if (node.hasAttribute('src') && node.getAttribute('src').indexOf('supabase') !== -1) {
          node.setAttribute('src', 'images/logo.png');
        }
        if (node.hasAttribute('href')) {
          var h = node.getAttribute('href');
          if (h.indexOf('/contact') !== -1 || h.indexOf('/support') !== -1 || h.indexOf('mailto:') !== -1) {
            node.setAttribute('href', TELEGRAM);
            node.setAttribute('target', '_blank');
          }
          if (h.indexOf('wa.me/') !== -1 && h.indexOf('DL_IPTV') === -1) {
            node.setAttribute('href', WHATSAPP);
            node.setAttribute('target', '_blank');
          }
          if (h.indexOf('twitter.com/') !== -1 || h.indexOf('facebook.com/') !== -1) {
            node.setAttribute('href', TELEGRAM);
            node.setAttribute('target', '_blank');
          }
        }
        for (var c of node.childNodes) rebrand(c);
      }
    }

    function run() { rebrand(document.body); }
    setTimeout(run, 500);
    setTimeout(run, 1500);
    setTimeout(run, 3000);
    setInterval(run, 3000);

    // Targeted: fix the WhatsApp display number in the contact card
    setInterval(function() {
      var spans = document.querySelectorAll('span');
      for (var i = 0; i < spans.length; i++) {
        if (spans[i].textContent.match(/17533390292|753.*339.*0292|\+1.*753/)) {
          spans[i].textContent = '@DL_IPTV';
        }
        if (spans[i].textContent.match(/Contact@DL IPTV\.com/i)) {
          spans[i].textContent = 'DL_IPTV';
        }
      }
      // Fix the "EMAIL" card that's actually pointing to Telegram
      var emailCards = document.querySelectorAll('h3');
      for (var j = 0; j < emailCards.length; j++) {
        if (emailCards[j].textContent.trim() === 'EMAIL' && emailCards[j].closest('a')) {
          var link = emailCards[j].closest('a');
          if (link.href.indexOf('t.me') !== -1) {
            emailCards[j].textContent = 'TELEGRAM';
          }
        }
      }
    }, 1500);
  })();

  // Disable right-click on images only
  document.addEventListener('contextmenu', function(e) {
    if (e.target.tagName === 'IMG') e.preventDefault();
  }, true);
  </script>
